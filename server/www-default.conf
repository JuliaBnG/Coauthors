# /etc/nginx/conf.d/default.conf of the `www` container (serves the site).
# The stock nginx:alpine server plus /review-api/ forwarded to the `review`
# container. Docker's resolver and a variable let nginx start even when
# `review` is down; the request URI is passed through unchanged.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Drafts change between rounds: browsers must revalidate every time
    # (without this they reuse a page for ~10% of its age since Last-Modified).
    location /progress/ {
        root   /usr/share/nginx/html;
        index  index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /review-api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $review http://review:8000;
        proxy_pass $review;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 300k;
        access_log off;      # Authorization headers are not logged anyway; keep paths out too
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
